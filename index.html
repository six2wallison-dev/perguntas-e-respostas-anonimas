<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pergunte ao Wallison (@_wallison_m) 🤫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090b;
      --card-bg: rgba(24, 24, 27, 0.85);
      --input-bg: #121215;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --ig-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --accent-glow: rgba(220, 39, 67, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(188, 24, 136, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(240, 148, 51, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 28px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }

    .avatar-ring {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      padding: 3px;
      background: var(--ig-gradient);
      margin-bottom: 10px;
      box-shadow: 0 8px 25px rgba(220, 39, 67, 0.35);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      border: 2px solid var(--bg-dark);
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .ig-handle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 10px;
      transition: color 0.2s;
    }

    .ig-handle:hover {
      color: #fff;
    }

    .badge-anonimo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .profile-header h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .profile-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.45;
      max-width: 360px;
    }

    .card-envio {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px -10px var(--accent-glow);
      margin-bottom: 36px;
    }

    .textarea-wrapper {
      position: relative;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .textarea-wrapper:focus-within {
      border-color: #dc2743;
      box-shadow: 0 0 0 3px rgba(220, 39, 67, 0.15);
    }

    textarea {
      width: 100%;
      height: 115px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      line-height: 1.5;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: #52525b;
    }

    .textarea-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
      color: #71717a;
    }

    .btn-enviar {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      background: var(--ig-gradient);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px -6px rgba(220, 39, 67, 0.5);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-enviar:active {
      transform: scale(0.98);
    }

    .btn-enviar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .garantia-rodape {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .status-alerta {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.4;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .status-sucesso {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #86efac;
    }

    .status-erro {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .mural-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .mural-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .mural-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .card-qa {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
      animation: fadeIn 0.4s ease;
    }

    .qa-pergunta-topo {
      background: var(--ig-gradient);
      padding: 14px 18px;
      color: #fff;
    }

    .qa-pergunta-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .qa-pergunta-texto {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .qa-resposta-corpo {
      padding: 16px 18px;
      background: #141417;
    }

    .qa-resposta-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .qa-resposta-texto {
      font-size: 0.95rem;
      color: #e4e4e7;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .estado-vazio {
      text-align: center;
      padding: 32px 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="profile-header">
    <div class="avatar-ring">
      <div class="avatar-inner">
        <img src="perfil.jpg" alt="Wallison" onerror="this.style.display='none'; this.parentElement.innerText='W';">
      </div>
    </div>

    <a href="https://instagram.com/_wallison_m" target="_blank" rel="noopener" class="ig-handle">
      @_wallison_m
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    </a>

    <div class="badge-anonimo">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      100% Anônimo • Sem cadastro
    </div>

    <h1>Pergunte ao Wallison 🤫</h1>
    <p>Envie uma mensagem anônima. Sua identidade nunca é revelada e a resposta aparece no mural abaixo.</p>
  </div>

  <div class="card-envio">
    <div class="textarea-wrapper">
      <textarea id="campoPergunta" placeholder="Escreva sua dúvida, curiosidade ou opinião sincera..." maxlength="400" oninput="atualizarContador()"></textarea>
      <div class="textarea-footer">
        <span>Modo anônimo ativo</span>
        <span id="contador">0/400</span>
      </div>
    </div>

    <button id="btnEnviar" class="btn-enviar" onclick="enviarPergunta()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Enviar anonimamente
    </button>

    <div class="garantia-rodape">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      O Wallison não saberá quem enviou
    </div>

    <div id="alertaStatus" class="status-alerta"></div>
  </div>

  <div class="mural-header">
    <h2>Respostas do Wallison</h2>
    <span class="mural-tag" id="totalRespostas">Carregando...</span>
  </div>

  <div id="listaRespostas">
    <div class="estado-vazio">Buscando respostas recentes...</div>
  </div>
</div>

<script>
  // =================================================================
  // COLE AQUI A URL DO SEU GOOGLE APPS SCRIPT (TERMINADA EM /exec)
  // =================================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFHxuJHSOKw2vtvTMAJ6AYDNQ03xzRHlVOea3DDkVATvj9WJ9LNl4qElOq1lr0vAjv/exec";

  let dadosVisitante = { ip: "Não identificado", pais: "", local: "" };

  window.onload = async function() {
    carregarMural();
    await registrarAcessoBrasil();
  };

  function atualizarContador() {
    const campo = document.getElementById("campoPergunta");
    document.getElementById("contador").innerText = `${campo.value.length}/400`;
  }

  // Captura IP, País e Cidade; só registra na planilha se for do Brasil (BR)
  async function registrarAcessoBrasil() {
    try {
      const res = await fetch("https://ipwho.is/");
      const geo = await res.json();

      if (geo && geo.success) {
        dadosVisitante.ip = geo.ip || "Não identificado";
        dadosVisitante.pais = geo.country_code || "";
        dadosVisitante.local = `${geo.city || ""} - ${geo.region_code || ""}`.trim();
      } else {
        const resBackup = await fetch("https://ipapi.co/json/");
        const geoBackup = await resBackup.json();
        dadosVisitante.ip = geoBackup.ip || "Não identificado";
        dadosVisitante.pais = geoBackup.country_code || "";
        dadosVisitante.local = `${geoBackup.city || ""} - ${geoBackup.region_code || ""}`.trim();
      }

      if (dadosVisitante.pais !== "BR") return;
      if (sessionStorage.getItem("acesso_registrado")) return;

      await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          tipo: "acesso",
          ip: dadosVisitante.ip,
          pais: dadosVisitante.pais,
          local: dadosVisitante.local,
          userAgent: navigator.userAgent
        })
      });

      sessionStorage.setItem("acesso_registrado", "1");
    } catch (e) {}
  }

  async function enviarPergunta() {
    const campo = document.getElementById("campoPergunta");
    const btn = document.getElementById("btnEnviar");
    const alerta = document.getElementById("alertaStatus");
    const texto = campo.value.trim();

    if (!texto) {
      alerta.className = "status-alerta status-erro";
      alerta.innerText = "Escreva uma pergunta antes de enviar.";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = "Enviando...";
    alerta.style.display = "none";

    if (dadosVisitante.ip === "Não identificado") {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        dadosVisitante.ip = data.ip;
      } catch (e) {}
    }

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          tipo: "pergunta",
          pergunta: texto,
          ip: dadosVisitante.ip,
          userAgent: navigator.userAgent
        })
      });

      const result = await response.json();

      if (result.status === "sucesso") {
        campo.value = "";
        atualizarContador();
        alerta.className = "status-alerta status-sucesso";
        alerta.innerHTML = "<strong>Pergunta enviada em sigilo!</strong><br>Volte nesta página mais tarde para ver a resposta abaixo.";
      } else {
        throw new Error(result.mensagem || "Erro no servidor");
      }
    } catch (error) {
      alerta.className = "status-alerta status-erro";
      alerta.innerText = "Não foi possível enviar agora. Tente novamente em instantes.";
    } finally {
      btn.disabled = false;
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        Enviar anonimamente
      `;
    }
  }

  async function carregarMural() {
    const container = document.getElementById("listaRespostas");
    const tagTotal = document.getElementById("totalRespostas");

    try {
      const res = await fetch(SCRIPT_URL);
      const lista = await res.json();

      tagTotal.innerText = `${lista.length} ${lista.length === 1 ? 'resposta' : 'respostas'}`;

      if (lista.length === 0) {
        container.innerHTML = '<div class="estado-vazio">Nenhuma pergunta respondida ainda.<br>Envie a primeira ali em cima! 👆</div>';
        return;
      }

      container.innerHTML = "";
      lista.forEach(item => {
        const dataCurta = item.data ? String(item.data).split(" ")[0] : "";

        const card = document.createElement("div");
        card.className = "card-qa";
        card.innerHTML = `
          <div class="qa-pergunta-topo">
            <div class="qa-pergunta-label">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              Pergunta Anônima
            </div>
            <div class="qa-pergunta-texto">${escaparHTML(item.pergunta)}</div>
          </div>
          <div class="qa-resposta-corpo">
            <div class="qa-resposta-label">
              <span>Resposta do Wallison</span>
              <span>${escaparHTML(dataCurta)}</span>
            </div>
            <div class="qa-resposta-texto">${escaparHTML(item.resposta)}</div>
          </div>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      tagTotal.innerText = "Offline";
      container.innerHTML = '<div class="estado-vazio">Não foi possível carregar o mural no momento.</div>';
    }
  }

  function escaparHTML(str) {
    return String(str).replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag]));
  }
</script>

</body>
</html>
